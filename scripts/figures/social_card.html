<!doctype html>
<!-- The blog post's link preview, 1200x630: no text (the card shows the title), one drawing in the
     style of Anthropic's research previews. A protein chain of beads; the next one, in Claude orange,
     is the residue the model predicts. Render: node scripts/figures/render_card.js -> figures/social_card.png -->
<html><head><meta charset="utf-8">
<style>
  * { margin:0; } body { width:1200px; height:630px; background:#e6dccd; overflow:hidden; }
  text { font-family:"Inter", "Helvetica Neue", Arial, sans-serif; font-weight:700; }
</style></head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g id="chain" filter="url(#hand)" stroke="#141413" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
<script>
  // a wavy backbone through bead centres, coming in from the left edge
  const pts = [[-60, 360], [80, 395], [195, 300], [305, 375], [420, 285], [530, 360], [640, 265], [750, 340], [860, 250], [1010, 290]];
  const letters = ["", "M", "K", "L", "V", "A", "W", "S", "V", "?"];
  const g = document.getElementById("chain"), NS = "http://www.w3.org/2000/svg";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
    d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  }
  const path = document.createElementNS(NS, "path");
  path.setAttribute("d", d); path.setAttribute("fill", "none");
  g.appendChild(path);
  const fills = ["#f4efe6", "#f4efe6", "#f4efe6", "#f4efe6", "#f4efe6", "#f4efe6", "#f4efe6", "#f4efe6"];
  pts.slice(1).forEach(([x, y], i) => {
    const last = i === pts.length - 2, r = last ? 62 : 46;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
    c.setAttribute("fill", last ? "#d97757" : fills[i]);
    g.appendChild(c);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", x); t.setAttribute("y", y + (last ? 22 : 15)); t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", last ? 62 : 42); t.setAttribute("fill", "#141413"); t.setAttribute("stroke", "none");
    t.textContent = letters[i + 1];
    g.appendChild(t);
  });
</script>
</body></html>
