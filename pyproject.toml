[project]
name = "bioseq-memorization"
version = "0.1.0"
description = "Probe whether closed LLMs were trained on biological sequence databases."
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "openai",
  "google-genai",
  "httpx",
  "python-dotenv",
  "pandas>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioseq_mem"]
