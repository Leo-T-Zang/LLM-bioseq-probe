[project]
name = "llm-bioseq-probe"
version = "0.1.0"
description = "Test whether LLMs have protein and DNA sequence data in their training data."
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "openai",
  "google-genai",
  "httpx",
  "python-dotenv",
  "pandas>=3.1.1",
  "matplotlib>=3.11.2",
  "scipy>=1.18.1",
]

[project.scripts]
probe-model = "bioseq_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioseq_probe"]
